name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swa-deploy
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:brand
      - run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_OPS_URL: ${{ vars.VITE_OPS_URL || 'https://ks-ops-dev.azurewebsites.net' }}
          VITE_PRODUCT_NAME: ${{ vars.VITE_PRODUCT_NAME }}
          VITE_CONTACT_ENDPOINT: ${{ vars.VITE_CONTACT_ENDPOINT }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      - name: No Azure site yet
        if: env.HAS_SWA_TOKEN != 'true'
        run: echo "::notice::AZURE_STATIC_WEB_APPS_API_TOKEN is not set - build checked, deploy skipped."
      - name: Deploy
        if: env.HAS_SWA_TOKEN == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          output_location: ""
          skip_app_build: true
